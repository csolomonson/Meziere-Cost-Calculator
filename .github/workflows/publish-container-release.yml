name: Publish container release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    name: Publish GHCR image and GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6

      - name: Validate the deployment release contract
        run: python3 -m unittest cost_calculator.tests.test_ubuntu_deployment_scripts -v

      - name: Validate release tag and image name
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            printf 'Release tags must use semantic versioning, for example v1.2.3.\n' >&2
            exit 1
          }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'asset=cost-calculator-%s-image.txt\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish the multi-platform image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: ./cost_calculator
          file: ./cost_calculator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
            VCS_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest the published image
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Record the immutable container reference
        env:
          APP_IMAGE: ${{ steps.release.outputs.image }}
          APP_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          ASSET_NAME: ${{ steps.release.outputs.asset }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s:%s@%s\n' "$APP_IMAGE" "$RELEASE_TAG" "$APP_IMAGE_DIGEST" > "$GITHUB_WORKSPACE/$ASSET_NAME"
          (cd "$GITHUB_WORKSPACE" && sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256")

      - name: Create the GitHub release
        env:
          ASSET_NAME: ${{ steps.release.outputs.asset }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET_NAME" "$ASSET_NAME.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET_NAME" "$ASSET_NAME.sha256" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
