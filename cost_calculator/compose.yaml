name: cost-calculator

services:
  app:
    image: ${COST_APP_IMAGE:?Set COST_APP_IMAGE to a released GHCR tag and digest}
    restart: unless-stopped
    init: true
    ports:
      - "443:8443"
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - app_state:/var/lib/cost-calculator

volumes:
  app_state:
    name: cost-calculator-data
